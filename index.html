<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание КАИ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="mode-week">
    
    <div id="loader"><div class="spinner"></div></div>
    
    <div class="modal-overlay" id="searchModal" onclick="closeSearchModal()">
        <div class="search-modal-content" onclick="event.stopPropagation()">
            <h3 style="margin: 0; font-size: 1.1rem; color: #fff;">Добавить в список</h3>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="Начните вводить..." autocomplete="off">
            </div>
            <div class="search-results" id="searchResults"></div>
            <button class="modal-close-btn" onclick="closeSearchModal()">Отмена</button>
        </div>
    </div>

    <div class="empty-state-container" id="emptyStateView">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 4v16m-8-8h16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2 class="empty-title">Список пуст</h2>
        <p class="empty-desc" id="emptyStateText">Добавьте данные, чтобы увидеть расписание</p>
        <button class="btn-primary-action" onclick="openSearchModal()">
            <span>+ Добавить</span>
        </button>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="mSubject" style="margin: 0 0 15px 0; font-size: 1.2rem; line-height: 1.3;"></h3>
            
            <div style="margin-bottom: 10px; color: var(--text-secondary); font-size: 0.9rem;">
                <span id="mType" style="color: #fff; font-weight: 700; background: #27272a; padding: 2px 6px; border-radius: 4px; margin-right: 8px;"></span>
                <span id="mTime"></span>
            </div>
            
            <div style="margin-bottom: 20px; font-size: 1rem; color: #e4e4e7;">
                📍 <span id="mRoom" style="font-weight: 600;"></span>
            </div>
            
            <div style="background: #27272a; padding: 12px; border-radius: 10px; margin-bottom: 15px;">
                <div id="mWhoLabel" style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px;">Преподаватель</div>
                <div id="mWho" style="font-weight: 600; color: var(--color-prac);"></div>
            </div>

            <div style="font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4;">
                <strong>Даты занятий:</strong><br><span id="mDates"></span>
            </div>
        </div>
    </div>

    <div class="settings-drawer" id="settingsDrawer" onclick="closeSettings()">
        <div class="settings-panel" onclick="event.stopPropagation()">
            <div class="drawer-handle"></div>
            
            <div class="type-selector-container">
                <button class="type-btn active" id="typeGroups" onclick="changeScheduleType('groups')">Студент</button>
                <button class="type-btn" id="typeTeachers" onclick="changeScheduleType('teachers')">Препод.</button>
                <button class="type-btn" id="typeRooms" onclick="changeScheduleType('rooms')">Аудит.</button>
            </div>

            <div class="settings-section-title">Вид расписания</div>
            <div class="view-mode-selector">
                <div class="view-opt" id="optWeek" onclick="changeViewMode('week')">По неделям</div>
                <div class="view-opt" id="optDate" onclick="changeViewMode('date')">По датам</div>
            </div>

            <div class="settings-section-title" id="savedListTitle">Мои группы</div>
            <div id="trackedGroupsList">
                </div>
            
            <button class="btn-add-group" id="btnAddItem" onclick="openSearchModal()">+ Добавить</button>

            <div style="text-align: center; margin-top: 25px; color: rgba(255,255,255,0.3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Расписание от 30.01.2026 v1</div>
        </div>
    </div>

    <div class="header-container">
        <div class="header-top">
            <div class="date-info">
                <h1 id="headerDate">-- ---</h1>
                <p id="headerSubInfo">Загрузка...</p>
            </div>
            <div class="controls-right">
                <div class="toggle-wrapper">
                    <div class="toggle-bg" id="toggleBg"></div>
                    <button class="toggle-btn active" id="btnOdd" onclick="setWeekMode('odd')">Нечёт</button>
                    <button class="toggle-btn" id="btnEven" onclick="setWeekMode('even')">Чёт</button>
                </div>
                <button class="settings-btn" onclick="toggleSettings()">
                    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                </button>
            </div>
        </div>
        
        <div class="nav-container">
            <div class="days-nav">
                <button class="day-tab active" onclick="goToSlide(0)">Пн</button>
                <button class="day-tab" onclick="goToSlide(1)">Вт</button>
                <button class="day-tab" onclick="goToSlide(2)">Ср</button>
                <button class="day-tab" onclick="goToSlide(3)">Чт</button>
                <button class="day-tab" onclick="goToSlide(4)">Пт</button>
                <button class="day-tab" onclick="goToSlide(5)">Сб</button>
            </div>
            <div class="date-nav-scroll" id="dateNav"></div>
        </div>
    </div>

    <div class="slider-container" id="sliderContainer" onclick="closeSettings()">
        <div class="slides-wrapper" id="slidesWrapper"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
